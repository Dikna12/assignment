<html>
    <head>
        <meta charset="utf-8">
    <title>Navigation Bar</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            font-family: "Arial";

        }
        h1{
            border-style: groove;
            padding-left: 250px;
            padding-right: 150px;
        }
        nav{
            background-color: dimgray;
            color: #998f8f;
            text-align: center;
            padding: 15px;
        }
        nav ul{
            list-style-type: none;
        }
        nav ul li{
            display: inline-block;
            padding: 5px 20px;
        }
        nav a{
            text-decoration: none;
            color: #070101;
        }
        nav a:hover {
            color: white;
        }
    </style>
    
    
    </head>
    <body>
        <h1>Navigation Bar Style</h1>
        <nav>
            <ul>
                <li><a href="#">Link 1</a></li>
                <li><a href="#">Link 2</a></li>
                <li><a href="#">Link 3</a></li>
                <li><a href="#">Link 4</a></li>
            </ul>
        </nav>
    </body>
</html>
