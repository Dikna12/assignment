<html>
    <head>
        <title>HTML FORM</title>
        <style>
            body{
                background-color: hwb(194 53% 22%);
            }
            .contact-form{
                max-width: 350px;
                margin: auto;
                border-radius: 5px;
                background: hsl(62, 54%, 71%);
                padding: 20px;
            }
            input[type=text] , select{
                width: 100%;
                padding: 12px 20px;
                margin: 8px;
                display: inline-block;
                border: 5px solid;
                border-radius: 5px;
                box-sizing: border-box;
            }
            input[type=submit] {
                width: 100%;
                background: purple;
                color: white;
                padding: 14px 20px;
                margin: 8px 0;
                border: none;
                border-radius: 4px;
                cursor: pointer;

            }
            input[type=submit] :hover{
                background: #000;
            }
            </style>
    </head>
    <body>
        <div class="container">
            <form>
                <label for="name"> Your name</label>
                <input type="text"name ="fullname" placeholder="Your Name..">
                <label for="email"> your Email</label>
                <input type="text"name ="email" placeholder="Your Email..">

                <input type="submit" value="Submit">
            </form>
        </div>
    </body>
</html>
